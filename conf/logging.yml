version: 1

formatters:
  default_format:
    format: '[%(asctime)s] [%(name)25s] %(levelname)8s | %(message)s'

handlers:
  # There are several Handlers available:
  # logging.handlers.RotatingFileHandler:
  #   Will rotate when the file reaches a certain size (see python logging documentation for args)
  # More handlers:
  # https://docs.python.org/3/library/logging.handlers.html#rotatingfilehandler

  EventFile:
    class: logging.handlers.RotatingFileHandler
    filename: '/var/log/openhab/events.log'
    maxBytes: 10_000_000
    backupCount: 3

    formatter: default_format
    level: DEBUG

  ZoneApisConsoleHandler:
    class: logging.StreamHandler
    stream: ext://sys.stdout

  ZoneApisFileHandler:
    class: logging.handlers.RotatingFileHandler
    filename: '/var/log/openhab/zones-api.log'
    maxBytes: 1_048_576
    backupCount: 3

    formatter: default_format
    level: DEBUG

loggers:
  ZoneApis:
    level: INFO
    handlers:
      - ZoneApisConsoleHandler
      - ZoneApisFileHandler
    propagate: False